name: Backend

# Builds the backend image and publishes it to GHCR, from where the production host
# pulls it ready-made (docker-compose.prod.yml, USER_ACTION.md §13). Tests run first,
# so an image without green tests is never published.
#
# Two things keep the publish step working:
#   * the image name repeats the repository name in lower case — the Container registry
#     links a package published by a workflow to the repository it runs in, and the
#     documented pattern is ghcr.io/<owner>/<repository>;
#   * the login uses the repository owner, because the packages are scoped to the
#     account given at login.
# If the installation token still cannot create the package, add a personal access
# token (classic) with `write:packages` as the repository secret GHCR_TOKEN: the
# workflow picks it up automatically (USER_ACTION.md §13).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/tattletallestrangler/gomokubackend

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The tests need a Docker engine: Testcontainers starts PostgreSQL.
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

  image:
    name: Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The server version from build.gradle.kts becomes the image tag, so a deploy
      # can be pinned to a version instead of `latest`.
      - name: Read the version from build.gradle.kts
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          test -n "$version"
          echo "project version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
