name: Backend

# Builds the backend image and publishes it to GHCR, from where the production host
# pulls it ready-made (docker-compose.prod.yml, USER_ACTION.md §13). Tests run first,
# so an image without green tests is never published.
#
# The package is private by default: either make it public in the GitHub package
# settings or give the host a token with `read:packages` (USER_ACTION.md §13).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tattletallestrangler/gomoku-backend

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The tests need a Docker engine: Testcontainers starts PostgreSQL.
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

  image:
    name: Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The server version from build.gradle.kts becomes the image tag, so a deploy
      # can be pinned to a version instead of `latest`.
      - name: Read the version from build.gradle.kts
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          test -n "$version"
          echo "project version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
