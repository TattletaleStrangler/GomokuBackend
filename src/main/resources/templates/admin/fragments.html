<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Gomoku admin</title>
    <style>
        :root { color-scheme: light dark; }
        body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #fafafa; color: #1a1a1a; }
        @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #e5e5e5; } }
        .nav { display: flex; gap: 16px; align-items: center; padding: 10px 16px; background: #ffffff;
               border-bottom: 1px solid #d8d8d8; flex-wrap: wrap; }
        @media (prefers-color-scheme: dark) { .nav { background: #2c2c2e; border-color: #3a3a3c; } }
        .nav a { text-decoration: none; color: inherit; }
        .nav .brand { font-weight: 700; margin-right: 12px; }
        .badge { background: #4a90d9; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 12px; }
        .logout { margin-left: auto; }
        main { padding: 16px; max-width: 1100px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e0e0e0; vertical-align: top; }
        @media (prefers-color-scheme: dark) { th, td { border-color: #3a3a3c; } }
        th { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
        .muted { opacity: .7; }
        .pill { border: 1px solid currentColor; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
        .pill.NEW { color: #d9822b; }
        .pill.REVIEWED { color: #4a90d9; }
        .pill.ACTIONED { color: #2e9e5b; }
        .pill.DISMISSED { color: #888; }
        .banned { color: #d32f2f; font-weight: 600; }
        form.act { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        select, input, button, textarea { font: inherit; padding: 5px 8px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; }
        @media (prefers-color-scheme: dark) { .card { background: #2c2c2e; border-color: #3a3a3c; } }
        .card b { display: block; font-size: 22px; }
        pre { overflow: auto; padding: 8px; background: #f0f0f0; border-radius: 6px; font-size: 12px; }
        @media (prefers-color-scheme: dark) { pre { background: #141416; } }
        .moves { font-family: ui-monospace, monospace; font-size: 13px; }
        .login { max-width: 340px; margin: 10vh auto; }
        .login input { width: 100%; margin-bottom: 8px; box-sizing: border-box; }
        .error { color: #d32f2f; }
    </style>
</head>
<body>
<nav th:fragment="nav" class="nav">
    <span class="brand">Gomoku · админка</span>
    <a th:href="@{/admin/reports}">Жалобы <span class="badge" th:text="${openReports}">0</span></a>
    <a th:href="@{/admin/errors}">Ошибки <span class="badge" th:text="${errorsToday}">0</span></a>
    <a th:href="@{/admin/crashes}">Падения <span class="badge" th:text="${crashesToday}">0</span></a>
    <form class="logout" th:action="@{/admin/logout}" method="post">
        <button type="submit">Выйти</button>
    </form>
</nav>
</body>
</html>
