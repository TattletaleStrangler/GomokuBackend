server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gomoku-backend

  datasource:
    # Inside docker-compose the database host is the service name, not localhost.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gomoku}
    username: ${SPRING_DATASOURCE_USERNAME:gomoku}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    # The schema belongs to Flyway: Hibernate may only verify it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Secrets come from the environment only; see ../Backend/.env.example.
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}

logging:
  level:
    root: INFO