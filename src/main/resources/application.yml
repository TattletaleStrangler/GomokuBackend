server:
  port: ${SERVER_PORT:8080}
  # Behind the reverse proxy the client address comes from X-Forwarded-For; the
  # application port itself is never published, so the header cannot be spoofed.
  forward-headers-strategy: framework

spring:
  application:
    name: gomoku-backend

  datasource:
    # Inside docker-compose the database host is the service name, not localhost.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gomoku}
    username: ${SPRING_DATASOURCE_USERNAME:gomoku}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    # The schema belongs to Flyway: Hibernate may only verify it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  admin:
    # Register an ordinary account with this nickname first, then restart: it is
    # promoted to administrator and may open /admin. Empty means nobody is promoted.
    nickname: ${ADMIN_NICKNAME:}
  jwt:
    # Secrets come from the environment only; see ../Backend/.env.example.
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  rate-limit:
    # Caps on /api/v1/auth/*: per address and per nickname (TZ_BACKEND.md §9).
    per-ip: 10
    ip-window: PT1M
    max-failed-logins: 5
    failed-login-window: PT15M
  game:
    # Background job that finishes games whose clock ran out; off in tests that
    # drive timeouts themselves.
    timeout-sweeper-enabled: true
    undo:
      # How long after a move it can still be taken back (2 s), how long the opponent
      # has to answer (3 s), and how many requests each player gets per game.
      window: PT2S
      decision-timeout: PT3S
      limit: 3
    draw:
      # A draw is a bigger decision than an undo, so the opponent gets ten seconds;
      # a refusal or a timeout costs the offerer one of three attempts.
      decision-timeout: PT10S
      limit: 3
    matchmaking:
      # How long a public room nobody joined stays in the lobby (FEATURES.md, B1), and
      # the Elo band of quick match: a room accepts a wider range the longer it waits
      # (FEATURES.md, B2).
      room-ttl: PT15M
      band-base: 200
      band-step: 50
      band-step-seconds: 5
      band-max: 600

logging:
  level:
    root: INFO